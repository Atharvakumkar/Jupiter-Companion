publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  google_maps_flutter: ^2.10.0
  flutter_blue_plus: ^1.35.4
  permission_handler: ^11.4.0
